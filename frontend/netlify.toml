[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api.mapbox.com https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.mapbox.com https://api.tiles.mapbox.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https://*.mapbox.com https://*.googleapis.com https://*.gstatic.com https://*.onrender.com https://res.cloudinary.com;
      connect-src 'self' https://event-booking-system-u1z3.onrender.com wss://event-booking-system-u1z3.onrender.com https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com https://fonts.googleapis.com https://fonts.gstatic.com;
      frame-src 'self' https://googleads.g.doubleclick.net https://www.google.com;
      worker-src blob:;
      child-src blob:;
    """